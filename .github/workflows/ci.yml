name: CI

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # TODO: make lint blocking after pre-existing lint errors are cleaned up
      - name: Lint
        continue-on-error: true
        run: npm run lint

      # TODO: make tsc blocking after pre-existing tsc errors are cleaned up
      - name: Type check
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Test with coverage
        run: npm run test:coverage

      - name: Audit dependencies
        run: npm audit --audit-level=high --omit=dev

      - name: Set branch-specific variables
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "production" ]; then
            echo "PREFIX=PROD" >> $GITHUB_OUTPUT
          else
            echo "PREFIX=DEV" >> $GITHUB_OUTPUT
          fi

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets[format('{0}_NEXT_PUBLIC_SUPABASE_URL', steps.vars.outputs.PREFIX)] }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets[format('{0}_NEXT_PUBLIC_SUPABASE_ANON_KEY', steps.vars.outputs.PREFIX)] }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets[format('{0}_NEXT_PUBLIC_SITE_URL', steps.vars.outputs.PREFIX)] }}

  publish:
    name: Publish
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set branch-specific variables
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "production" ]; then
            echo "PREFIX=PROD" >> $GITHUB_OUTPUT
          else
            echo "PREFIX=DEV" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata (production)
        if: github.ref_name == 'production'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=prod-,suffix=,format=short
            type=raw,value=production
            type=raw,value=latest

      - name: Extract metadata (main)
        if: github.ref_name != 'production'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets[format('{0}_NEXT_PUBLIC_SUPABASE_URL', steps.vars.outputs.PREFIX)] }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets[format('{0}_NEXT_PUBLIC_SUPABASE_ANON_KEY', steps.vars.outputs.PREFIX)] }}
            NEXT_PUBLIC_SITE_URL=${{ secrets[format('{0}_NEXT_PUBLIC_SITE_URL', steps.vars.outputs.PREFIX)] }}

      - name: Trigger Coolify deploy (production only)
        if: github.ref_name == 'production'
        run: |
          if [ -n "${{ secrets.COOLIFY_WEBHOOK_URL }}" ]; then
            curl -X POST \
              -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
              -H "Content-Type: application/json" \
              ${{ secrets.COOLIFY_WEBHOOK_URL }}
          else
            echo "No Coolify webhook configured. Deploy manually from Coolify dashboard."
          fi
