<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Equipment - eBiomed</title>
  <style>
    :root {
      --bg: oklch(98% 0.005 250); --surface: oklch(100% 0 0); --fg: oklch(22% 0.02 240);
      --muted: oklch(50% 0.018 240); --border: oklch(90% 0.008 240); --accent: #2563eb;
      --radius: 8px; --font: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--fg); max-width: 720px; }
    .back { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--muted); font-size: 0.875rem; text-decoration: none; margin-bottom: 1rem; }
    .back:hover { color: var(--accent); }
    h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .full { grid-column: 1 / -1; }
    .form-group { margin-bottom: 1rem; }
    .form-label { display: block; font-size: 0.8125rem; font-weight: 500; margin-bottom: 0.375rem; }
    .form-label .req { color: oklch(55% 0.22 25); }
    .form-input, .form-select, .form-textarea { display: block; width: 100%; padding: 0.5rem 0.75rem; border: 1px solid var(--border); border-radius: var(--radius); font-size: 0.875rem; font-family: var(--font); background: var(--surface); }
    .form-textarea { resize: vertical; min-height: 80px; }
    .form-input:focus, .form-select:focus, .form-textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    .btn { display: inline-flex; align-items: center; font-weight: 500; padding: 0.5rem 1rem; border-radius: var(--radius); border: 1px solid transparent; cursor: pointer; font-size: 0.875rem; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-outline { background: transparent; color: var(--fg); border-color: var(--border); }
    .btn-row { display: flex; gap: 0.75rem; margin-top: 1.5rem; }
    @media (max-width: 500px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <a href="equipment-list.html" class="back">← Equipment</a>
  <h2>New Equipment</h2>
  <div class="card">
    <form onsubmit="handleSubmit(event)">
      <div class="grid">
        <div class="form-group">
          <label class="form-label"><span class="req">*</span> Tag Number</label>
          <input class="form-input" required placeholder="e.g. BM-011">
        </div>
        <div class="form-group">
          <label class="form-label"><span class="req">*</span> Equipment Name</label>
          <input class="form-input" required placeholder="e.g. Ventilator V600">
        </div>
        <div class="form-group"><label class="form-label">Serial Number</label><input class="form-input" placeholder="SN-..."></div>
        <div class="form-group"><label class="form-label">Model</label><input class="form-input" placeholder="e.g. V600"></div>
        <div class="form-group"><label class="form-label">Manufacturer</label><input class="form-input" placeholder="e.g. Dräger"></div>
        <div class="form-group"><label class="form-label">Category</label><input class="form-input" placeholder="e.g. Ventilator"></div>
        <div class="form-group"><label class="form-label">Department</label><input class="form-input" placeholder="e.g. ICU"></div>
        <div class="form-group"><label class="form-label">Location</label><input class="form-input" placeholder="e.g. ICU Room 4"></div>
        <div class="form-group">
          <label class="form-label">Status</label>
          <select class="form-select"><option>Active</option><option>Inactive</option><option>Retired</option><option>Under Repair</option></select>
        </div>
        <div class="form-group"><label class="form-label">Install Date</label><input class="form-input" type="date"></div>
        <div class="form-group"><label class="form-label">Warranty Expiry</label><input class="form-input" type="date"></div>
      </div>
      <div class="form-group full"><label class="form-label">Notes</label><textarea class="form-textarea" rows="3"></textarea></div>
      <div class="btn-row">
        <button type="submit" class="btn btn-primary">Create Equipment</button>
        <button type="button" class="btn btn-outline" onclick="history.back()">Cancel</button>
      </div>
    </form>
  </div>
  <script>function handleSubmit(e){ e.preventDefault(); window.parent.document.querySelector('iframe[name="content-frame"]').src='screens/equipment-list.html'; }</script>
</body>
</html>
