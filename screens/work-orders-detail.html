<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Order Detail - eBiomed</title>
  <style>
    :root { --bg: oklch(98% 0.005 250); --surface: oklch(100% 0 0); --fg: oklch(22% 0.02 240); --muted: oklch(50% 0.018 240); --border: oklch(90% 0.008 240); --accent: #2563eb; --radius: 8px; --font: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:var(--font); background:var(--bg); color:var(--fg); max-width:720px; }
    .back { display:inline-flex; align-items:center; gap:0.5rem; color:var(--muted); font-size:0.875rem; text-decoration:none; margin-bottom:1rem; }
    h2 { font-size:1.5rem; font-weight:700; margin-bottom:1.5rem; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:1.5rem; margin-bottom:1rem; }
    .badge { display:inline-block; padding:0.2rem 0.625rem; border-radius:9999px; font-weight:500; font-size:0.6875rem; text-transform:capitalize; }
    .badge-green { background:oklch(95% 0.05 145); color:oklch(40% 0.15 145); }
    .badge-blue { background:oklch(95% 0.05 250); color:var(--accent); }
    .badge-yellow { background:oklch(95% 0.05 85); color:oklch(50% 0.18 85); }
    .badge-orange { background:oklch(95% 0.08 55); color:oklch(50% 0.18 55); }
    .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:1rem; }
    .info-item label { display:block; font-size:0.75rem; color:var(--muted); margin-bottom:0.125rem; }
    .info-item p { font-size:0.875rem; }
    .section-title { font-size:0.75rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; font-weight:600; margin-bottom:0.25rem; }
    .section-text { font-size:0.875rem; margin-bottom:1rem; white-space:pre-wrap; }
    .update-box { background:var(--bg); border:1px solid var(--border); border-radius:var(--radius); padding:1rem; }
    .update-box h4 { font-size:0.9375rem; margin-bottom:0.75rem; }
    .form-group { margin-bottom:1rem; }
    .form-label { display:block; font-size:0.8125rem; font-weight:500; margin-bottom:0.375rem; }
    .form-select, .form-textarea { display:block; width:100%; padding:0.5rem 0.75rem; border:1px solid var(--border); border-radius:var(--radius); font-size:0.875rem; font-family:var(--font); background:var(--surface); }
    .form-textarea { resize:vertical; min-height:80px; }
    .btn { display:inline-flex; align-items:center; font-weight:500; padding:0.5rem 1rem; border-radius:var(--radius); border:1px solid transparent; cursor:pointer; font-size:0.875rem; }
    .btn-primary { background:var(--accent); color:white; }
    @media(max-width:500px){ .info-grid{grid-template-columns:1fr;} }
  </style>
</head>
<body>
  <a href="work-orders-list.html" class="back">← Work Orders</a>
  <h2>Work Order Detail</h2>
  <div class="card">
    <div class="info-grid">
      <div class="info-item"><label>Equipment</label><p>Patient Monitor (BM-003)</p></div>
      <div class="info-item"><label>Type</label><p style="text-transform:capitalize">corrective</p></div>
      <div class="info-item"><label>Priority</label><p><span class="badge badge-blue">medium</span></p></div>
      <div class="info-item"><label>Status</label><p><span class="badge badge-green">open</span></p></div>
      <div class="info-item"><label>Assigned To</label><p>Unassigned</p></div>
      <div class="info-item"><label>Created By</label><p>Ali Abdulla</p></div>
      <div class="info-item"><label>Created</label><p>May 8, 2026</p></div>
    </div>
    <div class="section-title">Description</div>
    <div class="section-text">Display is flickering intermittently during patient monitoring. Occurs more frequently when brightness is above 70%.</div>
  </div>

  <div class="update-box">
    <h4>Update Status</h4>
    <div class="info-grid">
      <div class="form-group"><label class="form-label">New Status</label><select class="form-select"><option>Select status...</option><option>In Progress</option><option>On Hold</option><option>Completed</option><option>Cancelled</option></select></div>
    </div>
    <div class="form-group"><label class="form-label">Resolution Notes</label><textarea class="form-textarea" rows="3"></textarea></div>
    <button class="btn btn-primary">Update</button>
  </div>
</body>
</html>
