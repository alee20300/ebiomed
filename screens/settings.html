<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - eBiomed</title>
  <style>
    :root { --bg: oklch(98% 0.005 250); --surface: oklch(100% 0 0); --fg: oklch(22% 0.02 240); --muted: oklch(50% 0.018 240); --border: oklch(90% 0.008 240); --accent: #2563eb; --radius: 8px; --font: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:var(--font); background:var(--bg); color:var(--fg); max-width:800px; }
    .page-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; }
    h2 { font-size:1.5rem; font-weight:700; }
    .btn { display:inline-flex; align-items:center; gap:0.5rem; font-weight:500; padding:0.5rem 1rem; border-radius:var(--radius); border:1px solid transparent; cursor:pointer; font-size:0.875rem; }
    .btn-primary { background:var(--accent); color:white; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); }
    table { width:100%; border-collapse:collapse; font-size:0.875rem; }
    th,td { padding:0.75rem 1rem; text-align:left; border-bottom:1px solid var(--border); }
    th { color:var(--muted); font-weight:500; text-transform:uppercase; font-size:0.6875rem; letter-spacing:0.05em; }
    .modal-overlay { display:none; position:fixed; top:0;left:0;right:0;bottom:0; background:rgba(0,0,0,0.4); z-index:100; align-items:center; justify-content:center; }
    .modal-overlay.show { display:flex; }
    .modal { background:var(--surface); border-radius:var(--radius); padding:1.5rem; width:100%; max-width:420px; box-shadow:0 20px 60px rgba(0,0,0,0.2); }
    .modal h3 { font-size:1.125rem; margin-bottom:1rem; }
    .form-group { margin-bottom:1rem; }
    .form-label { display:block; font-size:0.8125rem; font-weight:500; margin-bottom:0.375rem; }
    .form-input, .form-select { display:block; width:100%; padding:0.5rem 0.75rem; border:1px solid var(--border); border-radius:var(--radius); font-size:0.875rem; font-family:var(--font); background:var(--surface); }
    .close-btn { background:none; border:none; font-size:1.25rem; cursor:pointer; color:var(--muted); }
    .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; }
  </style>
</head>
<body>
  <div class="page-header">
    <h2>Settings</h2>
    <button class="btn btn-primary" onclick="openModal('addUserModal')">+ Add User</button>
  </div>
  <div class="card" style="overflow-x:auto">
    <table>
      <thead><tr><th>Name</th><th>Role</th><th>Department</th><th>Phone</th></tr></thead>
      <tbody>
        <tr><td style="font-weight:500">Ali Abdulla</td><td style="text-transform:capitalize">admin</td><td>Biomed</td><td>—</td></tr>
        <tr><td style="font-weight:500">Sarah Chen</td><td style="text-transform:capitalize">technician</td><td>Biomed</td><td>—</td></tr>
        <tr><td style="font-weight:500">Mike Rivera</td><td style="text-transform:capitalize">technician</td><td>Biomed</td><td>—</td></tr>
      </tbody>
    </table>
  </div>

  <div class="modal-overlay" id="addUserModal">
    <div class="modal">
      <div class="modal-header"><h3>Create New User</h3><button class="close-btn" onclick="closeModal('addUserModal')">×</button></div>
      <div class="form-group"><label class="form-label">Full Name *</label><input class="form-input" required></div>
      <div class="form-group"><label class="form-label">Email *</label><input class="form-input" type="email" required></div>
      <div class="form-group"><label class="form-label">Password *</label><input class="form-input" type="password" required minlength="6"></div>
      <div class="form-group"><label class="form-label">Role</label><select class="form-select"><option>technician</option><option>admin</option><option>viewer</option></select></div>
      <div class="form-group"><label class="form-label">Department</label><input class="form-input"></div>
      <button class="btn btn-primary" style="width:100%" onclick="closeModal('addUserModal')">Create User</button>
    </div>
  </div>
  <script>
    function openModal(id) { document.getElementById(id).classList.add('show'); }
    function closeModal(id) { document.getElementById(id).classList.remove('show'); }
  </script>
</body>
</html>
