<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PM Schedules - eBiomed</title>
  <style>
    :root { --bg: oklch(98% 0.005 250); --surface: oklch(100% 0 0); --fg: oklch(22% 0.02 240); --muted: oklch(50% 0.018 240); --border: oklch(90% 0.008 240); --accent: #2563eb; --radius: 8px; --font: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:var(--font); background:var(--bg); color:var(--fg); }
    h2 { font-size:1.5rem; font-weight:700; margin-bottom:1.5rem; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); }
    table { width:100%; border-collapse:collapse; font-size:0.875rem; }
    th,td { padding:0.75rem 1rem; text-align:left; border-bottom:1px solid var(--border); }
    th { color:var(--muted); font-weight:500; text-transform:uppercase; font-size:0.6875rem; letter-spacing:0.05em; }
    tbody tr:hover { background:var(--bg); }
    a { color:var(--accent); text-decoration:none; font-weight:500; }
    .badge { display:inline-block; padding:0.2rem 0.625rem; border-radius:9999px; font-weight:500; font-size:0.6875rem; text-transform:capitalize; }
    .badge-red { background:oklch(95% 0.03 25); color:oklch(50% 0.2 25); }
    .badge-yellow { background:oklch(95% 0.05 85); color:oklch(50% 0.18 85); }
    .badge-blue { background:oklch(95% 0.05 250); color:var(--accent); }
    .badge-green { background:oklch(95% 0.05 145); color:oklch(40% 0.15 145); }
    .btn { display:inline-flex; align-items:center; font-weight:500; padding:0.375rem 0.75rem; border-radius:var(--radius); border:1px solid transparent; cursor:pointer; font-size:0.8125rem; background:var(--accent); color:white; }
    .btn:hover { filter:brightness(1.1); }
  </style>
</head>
<body>
  <h2>PM Schedules</h2>
  <div class="card" style="overflow-x:auto">
    <table>
      <thead><tr><th>Equipment</th><th>Frequency</th><th>Last Completed</th><th>Next Due</th><th>Status</th><th>Action</th></tr></thead>
      <tbody>
        <tr><td><a href="pm-schedules-detail.html">Ventilator V500</a></td><td>Every 90 days</td><td>Jan 2, 2026</td><td>Apr 2, 2026</td><td><span class="badge badge-red">Overdue</span></td><td><button class="btn" onclick="window.parent.document.querySelector('iframe[name=content-frame]').src='screens/work-orders-detail.html'">Start PM</button></td></tr>
        <tr><td><a href="pm-schedules-detail.html">Infusion Pump</a></td><td>Every 90 days</td><td>Feb 15, 2026</td><td>May 17, 2026</td><td><span class="badge badge-yellow">Due Today</span></td><td><button class="btn">Start PM</button></td></tr>
        <tr><td><a href="pm-schedules-detail.html">Patient Monitor</a></td><td>Every 180 days</td><td>Dec 10, 2025</td><td>Jun 8, 2026</td><td><span class="badge badge-blue">Upcoming</span></td><td><button class="btn">Start PM</button></td></tr>
        <tr><td><a href="pm-schedules-detail.html">Defibrillator</a></td><td>Every 90 days</td><td>Mar 20, 2026</td><td>Jun 18, 2026</td><td><span class="badge badge-green">OK</span></td><td></td></tr>
      </tbody>
    </table>
  </div>
</body>
</html>
