<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Work Order - eBiomed</title>
  <style>
    :root { --bg: oklch(98% 0.005 250); --surface: oklch(100% 0 0); --fg: oklch(22% 0.02 240); --muted: oklch(50% 0.018 240); --border: oklch(90% 0.008 240); --accent: #2563eb; --radius: 8px; --font: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:var(--font); background:var(--bg); color:var(--fg); max-width:720px; }
    .back { display:inline-flex; align-items:center; gap:0.5rem; color:var(--muted); font-size:0.875rem; text-decoration:none; margin-bottom:1rem; }
    h2 { font-size:1.5rem; font-weight:700; margin-bottom:1.5rem; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:1.5rem; }
    .form-group { margin-bottom:1rem; }
    .form-label { display:block; font-size:0.8125rem; font-weight:500; margin-bottom:0.375rem; }
    .form-input, .form-select, .form-textarea { display:block; width:100%; padding:0.5rem 0.75rem; border:1px solid var(--border); border-radius:var(--radius); font-size:0.875rem; font-family:var(--font); background:var(--surface); }
    .form-textarea { resize:vertical; min-height:100px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
    .btn { display:inline-flex; align-items:center; font-weight:500; padding:0.5rem 1rem; border-radius:var(--radius); border:1px solid transparent; cursor:pointer; font-size:0.875rem; }
    .btn-primary { background:var(--accent); color:white; }
    .btn-outline { background:transparent; color:var(--fg); border-color:var(--border); }
    .btn-row { display:flex; gap:0.75rem; margin-top:1.5rem; }
    @media(max-width:500px){ .grid{grid-template-columns:1fr;} }
  </style>
</head>
<body>
  <a href="work-orders-list.html" class="back">← Work Orders</a>
  <h2>New Work Order</h2>
  <div class="card">
    <form onsubmit="handleSubmit(event)">
      <div class="form-group"><label class="form-label">Equipment *</label><select class="form-select"><option>BM-001 — Ventilator V500</option><option>BM-002 — Infusion Pump</option><option>BM-003 — Patient Monitor</option><option>BM-004 — Defibrillator</option><option>BM-005 — Anesthesia Machine</option></select></div>
      <div class="grid">
        <div class="form-group"><label class="form-label">Type</label><select class="form-select"><option>Corrective</option><option>Preventive</option></select></div>
        <div class="form-group"><label class="form-label">Priority</label><select class="form-select"><option>Low</option><option selected>Medium</option><option>High</option><option>Critical</option></select></div>
      </div>
      <div class="form-group"><label class="form-label">Description *</label><textarea class="form-textarea" placeholder="Describe the issue or maintenance needed..." required></textarea></div>
      <div class="btn-row"><button type="submit" class="btn btn-primary">Create Work Order</button><button type="button" class="btn btn-outline" onclick="history.back()">Cancel</button></div>
    </form>
  </div>
  <script>function handleSubmit(e){ e.preventDefault(); window.parent.document.querySelector('iframe[name="content-frame"]').src='screens/work-orders-list.html'; }</script>
</body>
</html>
